name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar arquivos
        run: |
          set -e
          mkdir -p app/src/main/java/com/jnt/player app/src/main/res/values app/src/main/res/drawable-nodpi app/src/main/res/mipmap-anydpi-v26
          mv app.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv *.kt app/src/main/java/com/jnt/player/
          mv colors.xml themes.xml app/src/main/res/values/
          mv logo.png app/src/main/res/drawable-nodpi/
          mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JNT-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
